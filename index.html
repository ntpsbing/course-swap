<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新學年教師互相調課登記與管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Firebase SDK (v10.8.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            setDoc, 
            deleteDoc,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJzQmeIua1jCs2v7Rvg4LnWYU52-tHFIo",
            authDomain: "school-swap-system.firebaseapp.com",
            projectId: "school-swap-system",
            storageBucket: "school-swap-system.firebasestorage.app",
            messagingSenderId: "894518845264",
            appId: "1:894518845264:web:3c95d18f9c73989d789655",
            measurementId: "G-KXKK3HM0BF"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.firebaseDB = db;
            window.firestoreUtils = { collection, onSnapshot, doc, setDoc, deleteDoc, serverTimestamp };

            signInAnonymously(auth).then(() => {
                console.log("Firebase 匿名登入成功");
                window.dispatchEvent(new CustomEvent('firebase-ready'));
            }).catch(err => {
                console.error("Firebase 匿名登入失敗:", err);
                window.dispatchEvent(new CustomEvent('firebase-ready'));
            });
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800" x-data="swapApp()">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-indigo-700 to-indigo-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2 tracking-wide">
                <i class="fa-solid fa-arrow-right-arrow-left text-indigo-300"></i> 新學年教師互相調課登記與管理系統
            </h1>
            <div class="flex items-center gap-2 bg-indigo-800/80 backdrop-blur px-3.5 py-1.5 rounded-full text-xs font-medium border border-indigo-600/50">
                <span class="w-2.5 h-2.5 rounded-full" :class="isOnline ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'"></span>
                <span x-text="isOnline ? '🟢 雲端即時同步中' : '🟡 區域離線模式'"></span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <!-- 狀態統計區塊 (精簡為 2 選項欄位) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">雙方已講好</p>
                    <p class="text-3xl font-extrabold text-amber-500" x-text="stats.pending"></p>
                </div>
                <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-500 text-xl shadow-inner">
                    <i class="fa-regular fa-comments"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">已完成調課</p>
                    <p class="text-3xl font-extrabold text-emerald-600" x-text="stats.completed"></p>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-500 text-xl shadow-inner">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
        </div>

        <!-- 登記表單卡片 (保有原始完整欄位) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="bg-slate-50/80 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                    <span x-text="form.id ? '編輯調課紀錄' : '新增調課登記'"></span>
                </h2>
                <span class="text-xs text-slate-400">* 免登入即可填寫，資料自動同步</span>
            </div>
            
            <form @submit.prevent="saveRecord()" class="p-6 space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- 申請人 (原課) -->
                    <div class="p-5 rounded-xl border border-indigo-100 bg-indigo-50/30 space-y-4">
                        <div class="flex items-center gap-2 border-b border-indigo-100 pb-2.5">
                            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                            <h3 class="font-bold text-indigo-950 text-sm">【申請人 / 原授課課表】</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">教師姓名</label>
                                <input type="text" x-model="form.applicantName" placeholder="例如: 王小明" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">班級 / 年級</label>
                                <input type="text" x-model="form.applicantClass" placeholder="例如: 101班" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">星期</label>
                                <select x-model="form.applicantDay" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                    <template x-for="d in days" :key="d"><option :value="d" x-text="d"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">節次</label>
                                <select x-model="form.applicantPeriod" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                    <template x-for="p in periods" :key="p"><option :value="p" x-text="p"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">科目</label>
                                <input type="text" x-model="form.applicantSubject" placeholder="如: 數學" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>

                    <!-- 對調/代課人 -->
                    <div class="p-5 rounded-xl border border-slate-200 bg-slate-50/50 space-y-4">
                        <div class="flex items-center gap-2 border-b border-slate-200 pb-2.5">
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                            <h3 class="font-bold text-slate-800 text-sm">【被對調 / 代課教師】</h3>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">教師姓名</label>
                                <input type="text" x-model="form.respondentName" placeholder="例如: 陳大春" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">班級 / 年級</label>
                                <input type="text" x-model="form.respondentClass" placeholder="例如: 302班" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">星期</label>
                                <select x-model="form.respondentDay" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                    <template x-for="d in days" :key="d"><option :value="d" x-text="d"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">節次</label>
                                <select x-model="form.respondentPeriod" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                    <template x-for="p in periods" :key="p"><option :value="p" x-text="p"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">科目</label>
                                <input type="text" x-model="form.respondentSubject" placeholder="如: 國語" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 底部狀態與按鈕 (進度狀態僅有雙方已講好、已完成調課) -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2 border-t border-slate-100">
                    <div class="sm:w-80">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">進度狀態</label>
                        <select x-model="form.status" class="w-full px-3 py-2 border rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            <option value="雙方已講好">雙方已講好</option>
                            <option value="已完成調課">已完成調課</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-3">
                        <button type="button" x-show="form.id" @click="resetForm()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm hover:bg-slate-50 transition">取消編輯</button>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm shadow-md shadow-indigo-200 transition">
                            <i class="fa-solid fa-floppy-disk me-1.5"></i> <span x-text="form.id ? '儲存變更' : '送出登記'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 紀錄列表 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800">調課紀錄清單</h3>
                <div class="flex items-center gap-4">
                    <button @click="clearLocalCache()" class="text-xs text-rose-500 hover:text-rose-700 transition">清空離線快取</button>
                    <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold" x-text="`${records.length} 筆`"></span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-100 bg-slate-50 text-slate-500 text-xs uppercase">
                            <th class="py-3 px-6">登記時間 / 單號</th>
                            <th class="py-3 px-6">原授課人 (申請)</th>
                            <th class="py-3 px-6">調課對象 (受調)</th>
                            <th class="py-3 px-6">目前狀態</th>
                            <th class="py-3 px-6 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <template x-for="item in records" :key="item.id">
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="py-4 px-6 font-mono text-xs text-slate-500 font-semibold">
                                    <span class="inline-flex items-center gap-1.5 bg-slate-100 px-2.5 py-1 rounded-md text-slate-700">
                                        <i class="fa-regular fa-calendar-alt text-indigo-500"></i>
                                        <span x-text="formatDisplayID(item.id)"></span>
                                    </span>
                                </td>
                                <td class="py-4 px-6">
                                    <div class="font-bold text-slate-900 text-base" x-text="item.applicantName"></div>
                                    <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">
                                        <span class="bg-slate-100 px-1.5 py-0.5 rounded font-medium text-slate-600" x-text="item.applicantClass || item.applicantGrade || '未設班級'"></span>
                                        <span class="text-indigo-600 font-semibold" x-text="`${item.applicantDay || '星期一'} ${item.applicantPeriod}`"></span>
                                        <span class="text-slate-400">|</span>
                                        <span x-text="item.applicantSubject"></span>
                                    </div>
                                </td>
                                <td class="py-4 px-6">
                                    <div class="font-bold text-slate-900 text-base" x-text="item.respondentName"></div>
                                    <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">
                                        <span class="bg-slate-100 px-1.5 py-0.5 rounded font-medium text-slate-600" x-text="item.respondentClass || item.respondentGrade || '未設班級'"></span>
                                        <span class="text-indigo-600 font-semibold" x-text="`${item.respondentDay || '星期一'} ${item.respondentPeriod}`"></span>
                                        <span class="text-slate-400">|</span>
                                        <span x-text="item.respondentSubject"></span>
                                    </div>
                                </td>
                                <td class="py-4 px-6">
                                    <select 
                                        :value="item.status" 
                                        @change="updateStatus(item.id, $event.target.value)"
                                        class="px-3 py-1.5 text-xs font-bold rounded-full border shadow-sm cursor-pointer transition focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                                        :class="{
                                            'bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100': item.status.includes('雙方已講好'),
                                            'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100': item.status.includes('已完成調課')
                                        }">
                                        <option value="雙方已講好">雙方已講好</option>
                                        <option value="已完成調課">已完成調課</option>
                                    </select>
                                </td>
                                <td class="py-4 px-6 text-right space-x-2">
                                    <button @click="editRecord(item)" title="編輯" class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition inline-flex items-center justify-center"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button @click="deleteRecord(item.id)" title="刪除" class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition inline-flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="records.length === 0">
                            <td colspan="5" class="py-12 text-center text-slate-400">
                                <i class="fa-regular fa-folder-open text-3xl mb-2 block text-slate-300"></i>
                                目前尚無調課紀錄
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Alpine.js 邏輯 -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('swapApp', () => ({
                isOnline: false,
                days: ['星期一', '星期二', '星期三', '星期四', '星期五'],
                periods: ['第一節', '第二節', '第三節', '第四節', '第五節', '第六節', '第七節'],
                records: [],
                form: {
                    id: null,
                    applicantName: '',
                    applicantClass: '',
                    applicantDay: '星期一',
                    applicantPeriod: '第一節',
                    applicantSubject: '',
                    respondentName: '',
                    respondentClass: '',
                    respondentDay: '星期一',
                    respondentPeriod: '第二節',
                    respondentSubject: '',
                    status: '雙方已講好'
                },

                init() {
                    window.addEventListener('firebase-ready', () => {
                        this.initFirebaseSync();
                    });

                    const localData = localStorage.getItem('swap_records');
                    if (localData) {
                        try { 
                            this.records = JSON.parse(localData); 
                            this.sortRecords();
                        } catch(e){}
                    }
                },

                generateCleanID() {
                    const now = new Date();
                    const pad = (n) => String(n).padStart(2, '0');
                    return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
                },

                formatDisplayID(id) {
                    if (!id) return '';
                    if (String(id).length === 15 && String(id).includes('-')) {
                        const str = String(id);
                        const y = str.substring(0, 4);
                        const m = str.substring(4, 6);
                        const d = str.substring(6, 8);
                        const hh = str.substring(9, 11);
                        const mm = str.substring(11, 13);
                        const ss = str.substring(13, 15);
                        return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
                    }
                    return id;
                },

                sortRecords() {
                    this.records.sort((a, b) => String(b.id).localeCompare(String(a.id)));
                },

                get stats() {
                    return {
                        pending: this.records.filter(r => String(r.status).includes('雙方已講好')).length,
                        completed: this.records.filter(r => String(r.status).includes('已完成調課')).length
                    };
                },

                initFirebaseSync() {
                    if (!window.firebaseDB || !window.firestoreUtils) return;
                    
                    const { collection, onSnapshot } = window.firestoreUtils;
                    const colRef = collection(window.firebaseDB, 'teacher_swap_records');

                    onSnapshot(colRef, (snapshot) => {
                        this.isOnline = true;
                        const cloudRecords = [];
                        snapshot.forEach((doc) => {
                            cloudRecords.push({ id: doc.id, ...doc.data() });
                        });
                        this.records = cloudRecords;
                        this.sortRecords();
                        localStorage.setItem('swap_records', JSON.stringify(this.records));
                    }, (err) => {
                        console.error("Firestore 同步受阻:", err);
                        this.isOnline = false;
                    });
                },

                async saveRecord() {
                    const recordData = { ...this.form };
                    const recordId = recordData.id || this.generateCleanID();
                    delete recordData.id;

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, setDoc, serverTimestamp } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', String(recordId));
                            await setDoc(docRef, { ...recordData, updatedAt: serverTimestamp() }, { merge: true });
                        } catch (e) {
                            console.error("[Save Error]", e);
                        }
                    }

                    const index = this.records.findIndex(r => String(r.id) === String(recordId));
                    if (index > -1) {
                        this.records[index] = { id: recordId, ...recordData };
                    } else {
                        this.records.unshift({ id: recordId, ...recordData });
                    }
                    this.sortRecords();
                    localStorage.setItem('swap_records', JSON.stringify(this.records));
                    this.resetForm();
                },

                async updateStatus(id, newStatus) {
                    const targetId = String(id);
                    const item = this.records.find(r => String(r.id) === targetId);
                    if (item) {
                        item.status = newStatus;
                    }
                    localStorage.setItem('swap_records', JSON.stringify(this.records));

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, setDoc, serverTimestamp } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', targetId);
                            await setDoc(docRef, { status: newStatus, updatedAt: serverTimestamp() }, { merge: true });
                        } catch (e) {
                            console.error("[Update Status Error]", e);
                        }
                    }
                },

                async deleteRecord(id) {
                    if (!confirm("確定要刪除這筆紀錄嗎？")) return;

                    const targetId = String(id);
                    this.records = this.records.filter(r => String(r.id) !== targetId);
                    localStorage.setItem('swap_records', JSON.stringify(this.records));

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, deleteDoc } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', targetId);
                            await deleteDoc(docRef);
                        } catch (e) {
                            console.error("[Delete Error]", e);
                        }
                    }
                },

                clearLocalCache() {
                    if (confirm("是否確定清空本地快取並重新載入？")) {
                        localStorage.removeItem('swap_records');
                        location.reload();
                    }
                },

                editRecord(item) {
                    this.form = {
                        ...item,
                        applicantClass: item.applicantClass || item.applicantGrade || '',
                        respondentClass: item.respondentClass || item.respondentGrade || ''
                    };
                },

                resetForm() {
                    this.form = {
                        id: null,
                        applicantName: '',
                        applicantClass: '',
                        applicantDay: '星期一',
                        applicantPeriod: '第一節',
                        applicantSubject: '',
                        respondentName: '',
                        respondentClass: '',
                        respondentDay: '星期一',
                        respondentPeriod: '第二節',
                        respondentSubject: '',
                        status: '雙方已講好'
                    };
                }
            }));
        });
    </script>
</body>
</html>
