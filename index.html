<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師調代課即時登記系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Firebase SDK (v10.8.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            setDoc, 
            deleteDoc,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 配置項目
        const firebaseConfig = {
            apiKey: "AIzaSyAJzQmeIua1jCs2v7Rvg4LnWYU52-tHFIo",
            authDomain: "school-swap-system.firebaseapp.com",
            projectId: "school-swap-system",
            storageBucket: "school-swap-system.firebasestorage.app",
            messagingSenderId: "894518845264",
            appId: "1:894518845264:web:3c95d18f9c73989d789655",
            measurementId: "G-KXKK3HM0BF"
        };

        // 初始化 Firebase 並暴露至全域以利 Alpine.js 調用
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.firebaseDB = db;
            window.firestoreUtils = {
                collection,
                onSnapshot,
                doc,
                setDoc,
                deleteDoc,
                serverTimestamp
            };

            // 進行匿名登入以突破權限限制
            signInAnonymously(auth).then(() => {
                console.log("Firebase 匿名登入成功");
                window.dispatchEvent(new CustomEvent('firebase-ready'));
            }).catch(err => {
                console.error("Firebase 匿名登入失敗:", err);
            });
        } catch (e) {
            console.error("Firebase 初始化失敗:", e);
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800" x-data="swapApp()">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid me-2 fa-arrow-right-arrow-left"></i>教師調代課登記系統
            </h1>
            <div class="flex items-center gap-2 bg-indigo-800 px-3 py-1.5 rounded-full text-sm">
                <span class="w-3 h-3 rounded-full" :class="isOnline ? 'bg-green-400 animate-pulse' : 'bg-amber-400'"></span>
                <span x-text="isOnline ? '🟢 雲端即時同步中' : '🟡 區域離線模式'"></span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- 狀態統計區塊 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">雙方已講好 (待送審)</p>
                    <p class="text-2xl font-bold text-amber-600" x-text="stats.pending"></p>
                </div>
                <div class="w-12 h-12 bg-amber-50 rounded-full flex items-center justify-center text-amber-500 text-xl">
                    <i class="fa-regular fa-clock"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">教務處審核中</p>
                    <p class="text-2xl font-bold text-blue-600" x-text="stats.reviewing"></p>
                </div>
                <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-blue-500 text-xl">
                    <i class="fa-solid fa-spinner"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500 font-medium">已完成調課核備</p>
                    <p class="text-2xl font-bold text-emerald-600" x-text="stats.completed"></p>
                </div>
                <div class="w-12 h-12 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-500 text-xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
        </div>

        <!-- 登記新增/編輯表單 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                <span x-text="form.id ? '編輯調課申請' : '新增調課申請'"></span>
            </h2>
            <form @submit.prevent="saveRecord()" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 申請人資料 -->
                    <div class="p-4 bg-slate-50 rounded-lg space-y-3">
                        <h3 class="font-semibold text-indigo-900 border-b pb-2">【申請人 / 原授課】</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">教師姓名</label>
                                <input type="text" x-model="form.applicantName" required class="w-full px-3 py-2 border rounded-md text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">班級</label>
                                <select x-model="form.applicantGrade" class="w-full px-3 py-2 border rounded-md text-sm">
                                    <template x-for="g in grades" :key="g"><option :value="g" x-text="g"></option></template>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">節次</label>
                                <select x-model="form.applicantPeriod" class="w-full px-3 py-2 border rounded-md text-sm">
                                    <template x-for="p in periods" :key="p"><option :value="p" x-text="p"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">科目</label>
                                <input type="text" x-model="form.applicantSubject" required class="w-full px-3 py-2 border rounded-md text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 代課/對調人資料 -->
                    <div class="p-4 bg-slate-50 rounded-lg space-y-3">
                        <h3 class="font-semibold text-indigo-900 border-b pb-2">【被對調 / 代課人】</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">教師姓名</label>
                                <input type="text" x-model="form.respondentName" required class="w-full px-3 py-2 border rounded-md text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">班級</label>
                                <select x-model="form.respondentGrade" class="w-full px-3 py-2 border rounded-md text-sm">
                                    <template x-for="g in grades" :key="g"><option :value="g" x-text="g"></option></template>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">節次</label>
                                <select x-model="form.respondentPeriod" class="w-full px-3 py-2 border rounded-md text-sm">
                                    <template x-for="p in periods" :key="p"><option :value="p" x-text="p"></option></template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">科目</label>
                                <input type="text" x-model="form.respondentSubject" required class="w-full px-3 py-2 border rounded-md text-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <div class="w-1/3">
                        <label class="block text-xs text-slate-500 mb-1">當前狀態</label>
                        <select x-model="form.status" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                            <option value="雙方已講好 (待送教務處)">雙方已講好 (待送教務處)</option>
                            <option value="教務處審核中">教務處審核中</option>
                            <option value="已完成調課核備">已完成調課核備</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" x-show="form.id" @click="resetForm()" class="px-4 py-2 border text-slate-600 rounded-md text-sm hover:bg-slate-50">取消</button>
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700 shadow-sm transition">
                            <i class="fa-solid fa-floppy-disk me-1"></i> <span x-text="form.id ? '更新紀錄' : '儲存送出'"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 紀錄列表 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="font-bold text-slate-700">調課紀錄明細</h3>
                <span class="text-xs text-slate-500" x-text="`共 ${records.length} 筆資料`"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b bg-slate-100 text-slate-600">
                            <th class="p-3">申請人 (原課)</th>
                            <th class="p-3">對調/代課人</th>
                            <th class="p-3">調課狀態 (可直接切換)</th>
                            <th class="p-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="item in records" :key="item.id">
                            <tr class="border-b hover:bg-slate-50 transition">
                                <td class="p-3">
                                    <div class="font-bold text-slate-800" x-text="item.applicantName"></div>
                                    <div class="text-xs text-slate-500" x-text="`${item.applicantGrade} / ${item.applicantPeriod} / ${item.applicantSubject}`"></div>
                                </td>
                                <td class="p-3">
                                    <div class="font-bold text-slate-800" x-text="item.respondentName"></div>
                                    <div class="text-xs text-slate-500" x-text="`${item.respondentGrade} / ${item.respondentPeriod} / ${item.respondentSubject}`"></div>
                                </td>
                                <td class="p-3">
                                    <select 
                                        :value="item.status" 
                                        @change="updateStatus(item.id, $event.target.value)"
                                        class="px-2 py-1 text-xs font-semibold rounded border"
                                        :class="{
                                            'bg-amber-50 text-amber-700 border-amber-200': item.status === '雙方已講好 (待送教務處)',
                                            'bg-blue-50 text-blue-700 border-blue-200': item.status === '教務處審核中',
                                            'bg-emerald-50 text-emerald-700 border-emerald-200': item.status === '已完成調課核備'
                                        }">
                                        <option value="雙方已講好 (待送教務處)">雙方已講好 (待送教務處)</option>
                                        <option value="教務處審核中">教務處審核中</option>
                                        <option value="已完成調課核備">已完成調課核備</option>
                                    </select>
                                </td>
                                <td class="p-3 text-right space-x-1">
                                    <button @click="editRecord(item)" class="text-indigo-600 hover:text-indigo-900 p-1"><i class="fa-solid fa-pen"></i></button>
                                    <button @click="deleteRecord(item.id)" class="text-rose-600 hover:text-rose-900 p-1"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="records.length === 0">
                            <td colspan="4" class="p-6 text-center text-slate-400">目前尚無調課紀錄</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Alpine 應用邏輯 -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('swapApp', () => ({
                isOnline: false,
                grades: ['一年級', '二年級', '三年級', '四年級', '五年級', '六年級'],
                periods: ['第一節', '第二節', '第三節', '第四節', '第五節', '第六節', '第七節'],
                records: [],
                form: {
                    id: null,
                    applicantName: '',
                    applicantGrade: '一年級',
                    applicantPeriod: '第一節',
                    applicantSubject: '',
                    respondentName: '',
                    respondentGrade: '一年級',
                    respondentPeriod: '第二節',
                    respondentSubject: '',
                    status: '雙方已講好 (待送教務處)'
                },

                init() {
                    window.addEventListener('firebase-ready', () => {
                        this.initFirebaseSync();
                    });

                    // 備用本機讀取
                    const localData = localStorage.getItem('swap_records');
                    if (localData) {
                        this.records = JSON.parse(localData);
                    }
                },

                get stats() {
                    return {
                        pending: this.records.filter(r => r.status === '雙方已講好 (待送教務處)').length,
                        reviewing: this.records.filter(r => r.status === '教務處審核中').length,
                        completed: this.records.filter(r => r.status === '已完成調課核備').length
                    };
                },

                initFirebaseSync() {
                    if (!window.firebaseDB || !window.firestoreUtils) return;
                    
                    const { collection, onSnapshot } = window.firestoreUtils;
                    const colRef = collection(window.firebaseDB, 'teacher_swap_records');

                    onSnapshot(colRef, (snapshot) => {
                        this.isOnline = true;
                        const cloudRecords = [];
                        snapshot.forEach((doc) => {
                            cloudRecords.push({ id: doc.id, ...doc.data() });
                        });
                        this.records = cloudRecords;
                        localStorage.setItem('swap_records', JSON.stringify(this.records));
                    }, (err) => {
                        console.error("Firestore 同步監聽異常:", err);
                        this.isOnline = false;
                    });
                },

                async saveRecord() {
                    const recordData = { ...this.form };
                    const recordId = recordData.id || 'record_' + Date.now();
                    delete recordData.id;

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, setDoc, serverTimestamp } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', recordId);
                            await setDoc(docRef, {
                                ...recordData,
                                updatedAt: serverTimestamp()
                            }, { merge: true });
                        } catch (e) {
                            console.error("[Firestore Save Error]", e);
                            alert("雲端儲存失敗，已改暫存於本機");
                        }
                    }

                    // 本機更新
                    const index = this.records.findIndex(r => r.id === recordId);
                    if (index > -1) {
                        this.records[index] = { id: recordId, ...recordData };
                    } else {
                        this.records.unshift({ id: recordId, ...recordData });
                    }
                    localStorage.setItem('swap_records', JSON.stringify(this.records));
                    this.resetForm();
                },

                async updateStatus(id, newStatus) {
                    // 本機畫面快速搶先回應
                    const item = this.records.find(r => r.id === id);
                    if (item) item.status = newStatus;
                    localStorage.setItem('swap_records', JSON.stringify(this.records));

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, setDoc, serverTimestamp } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', id);
                            await setDoc(docRef, { 
                                status: newStatus,
                                updatedAt: serverTimestamp() 
                            }, { merge: true });
                        } catch (e) {
                            console.error("[Firestore Update Error]", e);
                            alert("權限不足或雲端更新失敗！");
                        }
                    }
                },

                async deleteRecord(id) {
                    if (!confirm("確定要刪除這筆調課紀錄嗎？")) return;

                    if (this.isOnline && window.firebaseDB) {
                        try {
                            const { doc, deleteDoc } = window.firestoreUtils;
                            const docRef = doc(window.firebaseDB, 'teacher_swap_records', id);
                            await deleteDoc(docRef);
                        } catch (e) {
                            console.error("[Firestore Delete Error]", e);
                            alert("雲端刪除失敗，請確認資料庫權限設定！");
                        }
                    }

                    this.records = this.records.filter(r => r.id !== id);
                    localStorage.setItem('swap_records', JSON.stringify(this.records));
                },

                editRecord(item) {
                    this.form = JSON.parse(JSON.stringify(item));
                },

                resetForm() {
                    this.form = {
                        id: null,
                        applicantName: '',
                        applicantGrade: '一年級',
                        applicantPeriod: '第一節',
                        applicantSubject: '',
                        respondentName: '',
                        respondentGrade: '一年級',
                        respondentPeriod: '第二節',
                        respondentSubject: '',
                        status: '雙方已講好 (待送教務處)'
                    };
                }
            }));
        });
    </script>
</body>
</html>
